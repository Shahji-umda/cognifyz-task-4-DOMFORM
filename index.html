<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Form Validation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .password-strength {
            height: 5px;
            transition: all 0.3s ease;
        }

        .strength-0 {
            width: 20%;
            background-color: #ef4444;
        }

        .strength-1 {
            width: 40%;
            background-color: #f97316;
        }

        .strength-2 {
            width: 60%;
            background-color: #eab308;
        }

        .strength-3 {
            width: 80%;
            background-color: #84cc16;
        }

        .strength-4 {
            width: 100%;
            background-color: #10b981;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .error-message.active {
            max-height: 50px;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Navigation -->
        <nav class="bg-white shadow-md rounded-lg mb-8">
            <ul class="flex justify-center space-x-4 p-4">
                <li><button onclick="showPage('register')"
                        class="px-4 py-2 rounded-lg hover:bg-green-100 transition">Registration</button>
                </li>
                <li><button onclick="showPage('login')"
                        class="px-4 py-2 rounded-lg hover:bg-green-100 transition">Login</button></li>
                <li><button onclick="showPage('dashboard')"
                        class="px-4 py-2 rounded-lg hover:bg-green-100 transition">Dashboard</button></li>
            </ul>
        </nav>

        <!-- Registration Page -->
        <div id="register" class="page active">
            <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
                <h1 class="text-2xl font-bold text-center mb-6">Create Account</h1>
                <form id="registrationForm" class="space-y-4">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="username" name="username"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        <div class="error-message text-red-500 text-sm" id="usernameError"></div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" name="email"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        <div class="error-message text-red-500 text-sm" id="emailError"></div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="relative">
                            <input type="password" id="password" name="password"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                            <button type="button" onclick="togglePasswordVisibility('password')"
                                class="absolute right-3 top-2 text-gray-500">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message text-red-500 text-sm" id="passwordError"></div>
                        <div class="mt-2">
                            <div class="password-strength strength-0" id="passwordStrength"></div>
                            <div class="text-xs text-gray-500 mt-1" id="passwordTips"></div>
                        </div>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm
                            Password</label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                            <button type="button" onclick="togglePasswordVisibility('confirmPassword')"
                                class="absolute right-3 top-2 text-gray-500">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message text-red-500 text-sm" id="confirmPasswordError"></div>
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" id="terms" name="terms"
                            class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                        <label for="terms" class="ml-2 block text-sm text-gray-700">
                            I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-500">Terms and
                                Conditions</a>
                        </label>
                    </div>
                    <div class="error-message text-red-500 text-sm" id="termsError"></div>

                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Register
                    </button>
                </form>
            </div>
        </div>

        <!-- Login Page -->
        <div id="login" class="page">
            <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
                <h1 class="text-2xl font-bold text-center mb-6">Login</h1>
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="loginEmail" class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="loginEmail" name="loginEmail"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        <div class="error-message text-red-500 text-sm" id="loginEmailError"></div>
                    </div>

                    <div>
                        <label for="loginPassword" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="relative">
                            <input type="password" id="loginPassword" name="loginPassword"
                                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                            <button type="button" onclick="togglePasswordVisibility('loginPassword')"
                                class="absolute right-3 top-2 text-gray-500">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message text-red-500 text-sm" id="loginPasswordError"></div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input type="checkbox" id="rememberMe" name="rememberMe"
                                class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="rememberMe" class="ml-2 block text-sm text-gray-700">
                                Remember me
                            </label>
                        </div>

                        <div class="text-sm">
                            <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">
                                Forgot your password?
                            </a>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Sign in
                    </button>
                </form>
            </div>
        </div>

        <!-- Dashboard Page -->
        <div id="dashboard" class="page">
            <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
                <h1 class="text-2xl font-bold text-center mb-6">Welcome to Your Dashboard</h1>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-indigo-50 p-6 rounded-lg">
                        <div class="flex items-center mb-4">
                            <div class="bg-indigo-100 p-3 rounded-full mr-4">
                                <i class="fas fa-user text-indigo-600"></i>
                            </div>
                            <h2 class="text-lg font-semibold">Profile</h2>
                        </div>
                        <p class="text-gray-600">Complete your profile to get the most out of our services.</p>
                        <button class="mt-4 text-indigo-600 hover:text-indigo-800 text-sm font-medium">Edit
                            Profile</button>
                    </div>

                    <div class="bg-green-50 p-6 rounded-lg">
                        <div class="flex items-center mb-4">
                            <div class="bg-green-100 p-3 rounded-full mr-4">
                                <i class="fas fa-chart-line text-green-600"></i>
                            </div>
                            <h2 class="text-lg font-semibold">Statistics</h2>
                        </div>
                        <p class="text-gray-600">View your activity and performance metrics.</p>
                        <button class="mt-4 text-green-600 hover:text-green-800 text-sm font-medium">View Stats</button>
                    </div>

                    <div class="bg-purple-50 p-6 rounded-lg">
                        <div class="flex items-center mb-4">
                            <div class="bg-purple-100 p-3 rounded-full mr-4">
                                <i class="fas fa-cog text-purple-600"></i>
                            </div>
                            <h2 class="text-lg font-semibold">Settings</h2>
                        </div>
                        <p class="text-gray-600">Customize your preferences and account settings.</p>
                        <button
                            class="mt-4 text-purple-600 hover:text-purple-800 text-sm font-medium">Configure</button>
                    </div>
                </div>

                <div class="mt-8">
                    <h2 class="text-xl font-semibold mb-4">Recent Activity</h2>
                    <div class="space-y-4" id="activityFeed">
                        <!-- Dynamic content will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Client-side routing
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');

            // Update dashboard content when shown
            if (pageId === 'dashboard') {
                updateDashboard();
            }
        }

        // Toggle password visibility
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = field.nextElementSibling.querySelector('i');

            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            const tips = [];

            // Check for minimum length
            if (password.length >= 8) strength++;
            else tips.push("Password should be at least 8 characters long.");

            // Check for uppercase letters
            if (/[A-Z]/.test(password)) strength++;
            else tips.push("Add at least one uppercase letter.");

            // Check for lowercase letters
            if (/[a-z]/.test(password)) strength++;
            else tips.push("Add at least one lowercase letter.");

            // Check for numbers
            if (/\d/.test(password)) strength++;
            else tips.push("Add at least one number.");

            // Check for special characters
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            else tips.push("Add at least one special character.");

            return { strength, tips };
        }

        // Update password strength meter
        document.getElementById('password').addEventListener('input', function (e) {
            const password = e.target.value;
            const strengthMeter = document.getElementById('passwordStrength');
            const tipsElement = document.getElementById('passwordTips');

            if (password.length === 0) {
                strengthMeter.className = 'password-strength strength-0';
                tipsElement.textContent = '';
                return;
            }

            const { strength, tips } = checkPasswordStrength(password);
            strengthMeter.className = `password-strength strength-${strength}`;

            if (tips.length > 0) {
                tipsElement.textContent = `Tip: ${tips[0]}`;
            } else {
                tipsElement.textContent = 'Strong password!';
            }
        });

        // Form validation
        function validateRegistrationForm() {
            let isValid = true;

            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.classList.remove('active');
            });

            // Validate username
            const username = document.getElementById('username').value.trim();
            if (username.length < 3) {
                showError('usernameError', 'Username must be at least 3 characters');
                isValid = false;
            }

            // Validate email
            const email = document.getElementById('email').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('emailError', 'Please enter a valid email address');
                isValid = false;
            }

            // Validate password
            const password = document.getElementById('password').value;
            const { strength } = checkPasswordStrength(password);
            if (strength < 3) {
                showError('passwordError', 'Password is too weak');
                isValid = false;
            }

            // Validate confirm password
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                showError('confirmPasswordError', 'Passwords do not match');
                isValid = false;
            }

            // Validate terms checkbox
            if (!document.getElementById('terms').checked) {
                showError('termsError', 'You must accept the terms and conditions');
                isValid = false;
            }

            return isValid;
        }

        function validateLoginForm() {
            let isValid = true;

            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.classList.remove('active');
            });

            // Validate email
            const email = document.getElementById('loginEmail').value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('loginEmailError', 'Please enter a valid email address');
                isValid = false;
            }

            // Validate password
            const password = document.getElementById('loginPassword').value;
            if (password.length < 6) {
                showError('loginPasswordError', 'Password must be at least 6 characters');
                isValid = false;
            }

            return isValid;
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.add('active');
        }

        // Form submission handlers
        document.getElementById('registrationForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (validateRegistrationForm()) {
                // Simulate successful registration
                alert('Registration successful! Redirecting to dashboard...');
                showPage('dashboard');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (validateLoginForm()) {
                // Simulate successful login
                alert('Login successful! Redirecting to dashboard...');
                showPage('dashboard');
            }
        });

        // Dashboard content updates
        function updateDashboard() {
            const activityFeed = document.getElementById('activityFeed');
            activityFeed.innerHTML = '';

            const activities = [
                { icon: 'fa-user-plus', color: 'text-blue-500', text: 'New account created', time: 'Just now' },
                { icon: 'fa-bell', color: 'text-yellow-500', text: 'Notification settings updated', time: '5 minutes ago' },
                { icon: 'fa-shield-alt', color: 'text-green-500', text: 'Password changed successfully', time: '1 hour ago' },
                { icon: 'fa-envelope', color: 'text-purple-500', text: 'Welcome email sent', time: '2 hours ago' }
            ];

            activities.forEach(activity => {
                const activityItem = document.createElement('div');
                activityItem.className = 'flex items-start p-3 hover:bg-gray-50 rounded-lg transition';
                activityItem.innerHTML = `
                    <div class="flex-shrink-0 mt-1">
                        <i class="fas ${activity.icon} ${activity.color}"></i>
                    </div>
                    <div class="ml-3 flex-1">
                        <p class="text-sm font-medium text-gray-900">${activity.text}</p>
                        <p class="text-xs text-gray-500">${activity.time}</p>
                    </div>
                `;
                activityFeed.appendChild(activityItem);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function () {
            // Set up event listeners for real-time validation
            document.getElementById('username').addEventListener('blur', function () {
                if (this.value.trim().length < 3) {
                    showError('usernameError', 'Username must be at least 3 characters');
                } else {
                    document.getElementById('usernameError').classList.remove('active');
                }
            });

            document.getElementById('email').addEventListener('blur', function () {
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.value.trim())) {
                    showError('emailError', 'Please enter a valid email address');
                } else {
                    document.getElementById('emailError').classList.remove('active');
                }
            });

            document.getElementById('confirmPassword').addEventListener('blur', function () {
                const password = document.getElementById('password').value;
                if (this.value !== password) {
                    showError('confirmPasswordError', 'Passwords do not match');
                } else {
                    document.getElementById('confirmPasswordError').classList.remove('active');
                }
            });
        });
    </script>
</body>

</html>
